name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "Pi (maarten.cv)"
    steps:
      # Join the tailnet as a short-lived, auto-removed tag:ci device, so the
      # SSH step below reaches the Pi over its private Tailscale address
      # instead of the internet. `ping` waits until the Pi is reachable.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT || 22 }}
          script: |
            cd ${{ secrets.PI_DEPLOY_PATH }}
            git pull
            docker compose up -d --build
